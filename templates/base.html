<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('page_title') }}</title>
    <meta name="description" content="{{ t('meta_description') }}">
    <link rel="icon" type="image/png" href="{{ sprite_src('brand/app-icon') }}">
    <link rel="alternate" hreflang="en" href="/">
    <link rel="alternate" hreflang="vi" href="/vi/">

    <!-- Theme before first paint: the saved choice, else the system setting -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('nd-theme');
                var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { }
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pixel.css') }}">
</head>

<body>
    {% block content %}{% endblock %}

    <!-- The words the scripts need (data, not code) -->
    <script type="application/json" id="i18n">{{ words_json|safe }}</script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
